# Fly.io config for ReTrace (FastAPI backend + built React SPA + OpenCode).
# App: retrace-dev  |  Org: lumena tech (personal)  |  Region: iad
#
# Single shared dev environment:
#   - push to `main`  -> auto-deploy (see .github/workflows/fly-deploy.yml)
#   - manual workflow -> deploy any branch here for live testing
# SQLite lives on the `retrace_data` volume so data survives deploys. Because a
# Fly volume attaches to one machine, this app runs exactly one machine.

app = "retrace-dev"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  DEBUG = "false"
  HOST = "0.0.0.0"
  PORT = "8000"
  LOG_FORMAT = "json"
  # SQLite on the mounted volume (absolute path -> 4 slashes after the scheme).
  DATABASE_URL = "sqlite+aiosqlite:////data/retrace.db"
  # Managed OpenCode: the backend spawns one OC server per user by running
  # this wrapper (bun run src/index.ts serve ...). Unset = managed mode.
  RETRACE_OPENCODE_BIN = "/opt/opencode/run-from-source.sh"
  # Tool-search deferral: OC advertises a small core toolset and loads the rest
  # on demand via tool_search, trimming per-call tool-definition tokens.
  # opencode_manager translates this to OPENCODE_EXPERIMENTAL_TOOL_SEARCH=1 per
  # spawned OC. Enabled 2026-06-02 after the 8 GB bump (mirrors retrace-trial).
  RETRACE_ENABLE_TOOL_SEARCH = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale-to-zero: this is an intermittently-used dev box, so let the single
  # machine sleep when idle and auto-start on the next request. We use
  # "suspend" (not "stop"): it freezes RAM and resumes warm in well under a
  # second, so the booted Xvfb/Chrome + per-user OpenCode/MCP processes survive
  # an idle gap instead of cold-restarting (~25s). Idle compute cost is still
  # ~zero — you pay only for the volume (~$0.45/mo) vs ~$22.89/mo running 24/7.
  # NOTE: an open /agent tab polls continuously, which keeps the machine awake;
  # gate frontend polling on idle/visibility to actually realise the savings.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# Persistent storage for the SQLite database.
[[mounts]]
  source = "retrace_data"
  destination = "/data"

# Single machine (required: the volume binds to one machine). Heavy stack
# (LangChain, PyMuPDF, numpy, uvicorn) PLUS per-user Bun OpenCode processes
# (each with ~5 MCP subprocesses). Bumped shared-cpu-2x:4 GB -> performance-4x:8 GB
# (2026-06-02) for headroom under concurrent managed-mode load — 4 GB risked OOM;
# mirrors retrace-trial. (Fly has no auto RAM-scaling, so this is a fixed size.)
[[vm]]
  size = "performance-4x"
  memory = "8192"
