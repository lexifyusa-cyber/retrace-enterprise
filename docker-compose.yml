services:
  postgres:
    image: postgres:16-alpine
    container_name: retrace-postgres
    environment:
      POSTGRES_DB: retrace
      POSTGRES_USER: retrace
      POSTGRES_PASSWORD: retrace_dev_password
    ports:
      - "5432:5432"
    volumes:
      - retrace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrace -d retrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retrace_postgres_data:
