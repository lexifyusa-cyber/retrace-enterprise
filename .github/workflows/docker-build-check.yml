# PR safety net: build the deployment image (no deploy) so a broken Dockerfile
# or frontend build is caught before merge. Does not need any secrets.
name: Docker build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: retrace-dev:ci
