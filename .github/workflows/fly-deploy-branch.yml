# Manually deploy ANY branch to the shared Fly app for live testing.
# Run from the GitHub UI: Actions -> "Deploy a branch to Fly (manual test)"
# -> Run workflow -> pick the branch.
# When finished testing, restore the app by running "Deploy main to Fly"
# (Actions tab) or by pushing/merging to main.
name: Deploy a branch to Fly (manual test)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to retrace-dev.fly.dev"
        required: true
        default: "main"

concurrency:
  group: fly-deploy-retrace-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: flyctl deploy (${{ github.event.inputs.branch }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy branch
        run: |
          echo "Deploying branch '${{ github.event.inputs.branch }}' to retrace-dev"
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
